name: Tests

on:
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22

            - name: Install dependencies
              run: npm ci

            - name: Run test suite
              run: xvfb-run -a npm test
